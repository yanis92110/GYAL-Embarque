name: Day 1 checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run data and numerical tests
        run: python3 -m unittest discover -s tests -v
